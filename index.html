<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ドライブ飯ルーレット</title>
<meta name="description" content="深夜のドライブ先を決めるご当地グルメルーレット。大当たり演出のあと、観光・夜景スポットと地図リンク付きの旅のしおりが出てきます。">

<!-- ホーム画面に追加した際、フルスクリーンの単体アプリのように開くための設定 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ドライブ飯">
<meta name="application-name" content="ドライブ飯ルーレット">
<meta name="theme-color" content="#ffc857">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22%E3%83%89%E3%83%A9%E3%82%A4%E3%83%96%E9%A3%AF%E3%83%AB%E3%83%BC%E3%83%AC%E3%83%83%E3%83%88%22%2C%22short_name%22%3A%22%E3%83%89%E3%83%A9%E3%82%A4%E3%83%96%E9%A3%AF%22%2C%22display%22%3A%22standalone%22%2C%22start_url%22%3A%22.%22%2C%22background_color%22%3A%22%23fff2da%22%2C%22theme_color%22%3A%22%23ffc857%22%7D">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap">
<style>
  :root{
    --ink:#2b2440;
    --paper:#fffaf1;
    --paper-2:#fff0da;
    --coral:#ff6b4a;
    --gold:#ffc857;
    --sky-top:#bfe6ff;
    --sky-bottom:#fff2da;
    --dim:#7a7192;
    --line:rgba(43,36,64,.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:
      radial-gradient(ellipse 90% 50% at 25% 0%, #ffffff 0%, transparent 55%),
      linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 55%, var(--paper) 100%);
    color:var(--ink);
    font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
    min-height:100vh;
    min-height:100dvh;
    overflow-x:hidden;
    padding-top:env(safe-area-inset-top,0px);
    padding-left:env(safe-area-inset-left,0px);
    padding-right:env(safe-area-inset-right,0px);
  }
  .display{font-family:"Dela Gothic One","Zen Maru Gothic",sans-serif;}

  /* ambient sparkle */
  .stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .stars i{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px rgba(255,200,87,.8);opacity:.55;animation:twinkle 3.2s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.25;transform:scale(1);}50%{opacity:.9;transform:scale(1.5);}}

  .stage{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:28px 20px 40px;}

  /* ---------- Roulette view ---------- */
  #view-roulette{display:flex;flex-direction:column;align-items:center;gap:22px;padding-block:24px 8px;}
  .eyebrow{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:13px;letter-spacing:.08em;}
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--coral);box-shadow:0 0 8px var(--coral);}
  h1.title{
    font-size:clamp(26px,7vw,34px);
    text-align:center;
    line-height:1.3;
    text-wrap:balance;
    margin:0;
  }
  h1.title span{color:var(--coral);}
  .subtitle{color:var(--dim);font-size:14px;text-align:center;margin:0;max-width:32ch;}

  .wheel-wrap{position:relative;width:min(84vw,340px);aspect-ratio:1;margin-top:6px;}
  .wheel-glow{position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,rgba(255,200,87,.35),transparent 70%);filter:blur(6px);}
  .bulbs{position:absolute;inset:-16px;}
  .bulbs i{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px var(--gold);left:50%;top:50%;margin:-4px;animation:bulb 1.4s linear infinite;}
  @keyframes bulb{0%,100%{opacity:.25;}50%{opacity:1;}}
  .pointer{position:absolute;top:-10px;left:50%;transform:translateX(-50%);z-index:3;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5));}
  #wheelSvg{position:relative;z-index:2;width:100%;height:100%;display:block;}
  #wheelGroup{transform-box:view-box;transform-origin:200px 200px;transform:rotate(0deg);transition:transform 4.2s cubic-bezier(.12,.68,.14,1);}

  .spin-btn{
    appearance:none;border:none;cursor:pointer;
    font-family:"Dela Gothic One",sans-serif;
    font-size:20px;letter-spacing:.04em;color:#221200;
    padding:18px 46px;border-radius:999px;
    background:linear-gradient(180deg,#ffe08a,var(--gold) 55%,#e6a51c);
    box-shadow:0 10px 22px rgba(230,150,20,.4),0 4px 10px rgba(43,36,64,.15),inset 0 2px 0 rgba(255,255,255,.6),inset 0 -4px 0 rgba(0,0,0,.15);
    transition:transform .12s ease, box-shadow .12s ease, opacity .2s ease;
  }
  .spin-btn:active{transform:translateY(2px) scale(.98);box-shadow:0 4px 14px rgba(230,150,20,.35),inset 0 2px 0 rgba(255,255,255,.5);}
  .spin-btn:disabled{opacity:.55;cursor:default;transform:none;}
  .hint{color:var(--dim);font-size:12.5px;text-align:center;}

  /* ---------- Jackpot overlay ---------- */
  #jackpot{
    position:fixed;inset:0;z-index:20;display:none;
    align-items:center;justify-content:center;flex-direction:column;gap:10px;
    background:radial-gradient(circle at 50% 50%, rgba(255,200,87,.65), rgba(255,246,230,.97) 65%);
  }
  #jackpot .rays{position:absolute;inset:-20%;background:conic-gradient(from 0deg, transparent 0deg 10deg, rgba(255,107,74,.3) 10deg 12deg, transparent 12deg 40deg);animation:spinRays 3s linear infinite;}
  @keyframes spinRays{to{transform:rotate(360deg);}}
  #jackpot .burst{position:relative;font-size:44px;text-align:center;font-family:"Dela Gothic One",sans-serif;color:var(--coral);text-shadow:0 3px 0 rgba(255,255,255,.7),0 0 22px rgba(255,200,87,.9);transform:scale(.6);opacity:0;animation:burstIn .55s cubic-bezier(.2,1.4,.4,1) forwards .1s;}
  @keyframes burstIn{to{transform:scale(1);opacity:1;}}
  #jackpot .burst small{display:block;font-family:"Zen Maru Gothic",sans-serif;font-size:15px;color:var(--ink);margin-top:6px;letter-spacing:.05em;}
  .confetti-piece{position:absolute;top:-10px;width:9px;height:14px;opacity:.9;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(115vh) rotate(540deg);opacity:.2;}}

  /* ---------- Itinerary view ---------- */
  #view-shiori{display:none;}
  .ticket{background:var(--paper);border-radius:22px;overflow:hidden;border:1px solid var(--line);box-shadow:0 20px 40px rgba(43,36,64,.18);}
  .hero{position:relative;padding:30px 22px 26px;overflow:hidden;color:#fff;}
  .hero::before{content:"";position:absolute;inset:0;background:var(--hero-bg);z-index:0;}
  .hero::after{content:"";position:absolute;right:-30px;bottom:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.14);z-index:0;}
  .hero-inner{position:relative;z-index:1;}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .badge{background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.3);padding:4px 12px;border-radius:999px;font-size:12px;letter-spacing:.03em;}
  .hero-emoji{font-size:52px;line-height:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25));}
  .hero-name{font-family:"Dela Gothic One",sans-serif;font-size:clamp(24px,7vw,30px);margin:10px 0 6px;text-wrap:balance;}
  .hero-desc{font-size:14px;line-height:1.7;opacity:.95;max-width:44ch;}
  .mainlink{display:inline-flex;align-items:center;gap:6px;margin-top:16px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.35);padding:9px 16px;border-radius:999px;font-size:13px;color:#fff;text-decoration:none;}
  .mainlink:active{background:rgba(0,0,0,.4);}

  .section-label{display:flex;align-items:center;gap:10px;padding:20px 22px 4px;color:var(--dim);font-size:13px;letter-spacing:.04em;}
  .section-label .icon{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--paper-2);font-size:14px;}

  .spot-card{margin:10px 18px 18px;padding:16px 16px 14px;background:var(--paper-2);border-radius:16px;border:1px solid var(--line);}
  .spot-name{font-weight:700;font-size:16px;margin:0 0 6px;color:var(--ink);}
  .spot-desc{color:var(--dim);font-size:13.5px;line-height:1.7;margin:0 0 12px;}
  .maplink{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);background:var(--gold);padding:8px 14px;border-radius:999px;text-decoration:none;font-weight:700;}
  .maplink:active{filter:brightness(.92);}

  .again-bar{position:sticky;bottom:0;padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg, transparent, var(--paper) 30%);}
  .again-btn{
    width:100%;appearance:none;border:none;cursor:pointer;
    font-family:"Dela Gothic One",sans-serif;font-size:16px;color:var(--ink);
    padding:15px;border-radius:14px;background:var(--paper-2);border:1px solid var(--line);
  }
  .again-btn:active{background:#ffe4bd;}

  @media (prefers-reduced-motion: reduce){
    .bulbs i, .stars i, #jackpot .rays, #jackpot .burst{animation:none !important;}
    #wheelGroup{transition-duration:1.2s;}
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="stage">

  <section id="view-roulette">
    <div class="eyebrow"><span class="dot"></span>今夜のドライブ飯を決める</div>
    <h1 class="title">ドライブ飯<span>ルーレット</span></h1>
    <p class="subtitle">スタートを押すと、今夜向かうご当地グルメが決まります。</p>

    <div class="wheel-wrap">
      <div class="wheel-glow"></div>
      <div class="bulbs" id="bulbs"></div>
      <svg class="pointer" width="34" height="38" viewBox="0 0 34 38"><polygon points="17,34 2,4 32,4" fill="#ffc857" stroke="#2b2440" stroke-width="2"/></svg>
      <svg id="wheelSvg" viewBox="0 0 400 400">
        <g id="wheelGroup"></g>
        <circle cx="200" cy="200" r="36" fill="#2b2440" stroke="#ffc857" stroke-width="4"/>
        <text x="200" y="208" text-anchor="middle" font-size="26">🚗</text>
      </svg>
    </div>

    <button class="spin-btn" id="spinBtn">START</button>
    <p class="hint">全7ルート・当選確率は均等です</p>
  </section>

  <section id="view-shiori">
    <div class="ticket">
      <div class="hero" id="hero">
        <div class="hero-inner">
          <div class="badges">
            <span class="badge" id="badgePref"></span>
            <span class="badge" id="badgeRoute"></span>
          </div>
          <div class="hero-emoji" id="heroEmoji"></div>
          <div class="hero-name" id="heroName"></div>
          <p class="hero-desc" id="heroDesc"></p>
          <a class="mainlink" id="mainMapLink" href="#" target="_blank" rel="noopener">📍 現地の地図を開く</a>
        </div>
      </div>

      <div class="section-label"><span class="icon">🗺️</span>近くの観光スポット</div>
      <div class="spot-card">
        <p class="spot-name" id="sightName"></p>
        <p class="spot-desc" id="sightDesc"></p>
        <a class="maplink" id="sightMapLink" href="#" target="_blank" rel="noopener">Googleマップで見る</a>
      </div>

      <div class="section-label"><span class="icon">🌃</span>近くの夜景スポット</div>
      <div class="spot-card">
        <p class="spot-name" id="nightName"></p>
        <p class="spot-desc" id="nightDesc"></p>
        <a class="maplink" id="nightMapLink" href="#" target="_blank" rel="noopener">Googleマップで見る</a>
      </div>

      <div class="again-bar">
        <button class="again-btn" id="againBtn">🎲 もう一度ルーレットを回す</button>
      </div>
    </div>
  </section>

</div>

<div id="jackpot">
  <div class="rays"></div>
  <div class="burst" id="burstText">🎉 決定 🎉<small>今夜の行き先はこちら</small></div>
</div>

<script>
(function(){
  var DESTINATIONS = [
    {
      pref:"栃木", name:"宇都宮餃子", route:"東北道", emoji:"🥟", accent:"#ff6b4a",
      desc:"焼き・水・揚げ、三種の食べ比べができる餃子の街。",
      mainMapQuery:"宇都宮餃子会 来らっせ",
      sight:{name:"大谷資料館", desc:"巨大な地下採掘場跡が広がる、ひんやり幻想的な空間。写真映え抜群のスポット。", mapQuery:"大谷資料館"},
      night:{name:"古賀志山 展望スポット", desc:"宇都宮の市街地と関東平野の灯りを見渡せる、地元で知られた高台。", mapQuery:"古賀志山"}
    },
    {
      pref:"千葉", name:"房総海鮮浜焼きBBQ", wheelLabel:"海鮮BBQ", route:"アクアライン・館山道", emoji:"🦐", accent:"#2fb8c6",
      desc:"ホタテ・サザエ・ハマグリを二人で網焼き。行き帰りの海ほたるも楽しみのひとつ。",
      mainMapQuery:"保田漁協 ばんや",
      sight:{name:"鋸山 日本寺", desc:"断崖絶壁からの絶景「地獄のぞき」と、迫力の大仏で知られる名所。", mapQuery:"鋸山日本寺"},
      night:{name:"海ほたるPA", desc:"東京湾アクアライン上に浮かぶ、東京湾の夜景が広がるパーキングエリア。", mapQuery:"海ほたるPA"}
    },
    {
      pref:"神奈川", name:"本厚木シロコロホルモン", wheelLabel:"シロコロ", route:"東名・圏央道", emoji:"🍢", accent:"#ff9142", text:"dark",
      desc:"脂の詰まったホルモンをコロコロ転がして焼く、厚木のご当地グルメ。",
      mainMapQuery:"本厚木 シロコロホルモン",
      sight:{name:"大山阿夫利神社", desc:"ケーブルカーで登れるパワースポット。境内から相模平野を一望できる。", mapQuery:"大山阿夫利神社"},
      night:{name:"湘南平", desc:"丘の上の展望台から街の灯りと相模湾を見渡せる夜景スポット。", mapQuery:"湘南平"}
    },
    {
      pref:"神奈川", name:"三崎まぐろ", route:"横横道路", emoji:"🐟", accent:"#3aa7d6",
      desc:"赤身・トロ・カブト焼きまで、三浦半島で味わう本場のまぐろ尽くし。",
      mainMapQuery:"三崎港 まぐろ食堂街",
      sight:{name:"城ヶ島", desc:"岩礁と灯台が織りなす景勝地。海沿いの遊歩道の散策が心地いい。", mapQuery:"城ヶ島"},
      night:{name:"城ヶ島公園", desc:"灯台のそばから海を望む、静かで開放的な夜景スポット。", mapQuery:"城ヶ島公園"}
    },
    {
      pref:"静岡", name:"さわやか", route:"東名・新東名", emoji:"🍔", accent:"#e2574c",
      desc:"炭焼きのげんこつハンバーグ。並んで待つ時間もドライブの醍醐味。",
      mainMapQuery:"さわやか 御殿場インター店",
      sight:{name:"御殿場高原 時之栖", desc:"温泉や散策路もある複合リゾート施設。富士山麓の空気が心地いい。", mapQuery:"御殿場高原時之栖"},
      night:{name:"時之栖 イルミネーション", desc:"富士山麓の澄んだ空気の中で楽しめる、光の演出が魅力のスポット。", mapQuery:"御殿場高原時之栖 イルミネーション"}
    },
    {
      pref:"静岡", name:"富士宮やきそば", wheelLabel:"やきそば", route:"東名・新東名", emoji:"🍜", accent:"#f2a341", text:"dark",
      desc:"コシの強い蒸し麺に肉かすと魚粉。鉄板で仕上げるご当地B級グルメ。",
      mainMapQuery:"富士宮やきそば",
      sight:{name:"白糸ノ滝", desc:"幅広く扇状に流れ落ちる名瀑。富士山の構成資産にも数えられる景勝地。", mapQuery:"白糸ノ滝"},
      night:{name:"富士山本宮浅間大社 周辺", desc:"富士山を背に、静かで趣のある夜の街並みを楽しめるエリア。", mapQuery:"富士山本宮浅間大社"}
    },
    {
      pref:"山梨", name:"甲州ほうとう", route:"中央道", emoji:"🍲", accent:"#7c6cf0",
      desc:"具だくさん味噌煮込みの太麺と、甘辛い鳥もつ煮が名物の郷土料理。",
      mainMapQuery:"ほうとう 小作 甲府昭和インター店",
      sight:{name:"昇仙峡", desc:"奇岩と清流が織りなす、渓谷美で知られる日本屈指の景勝地。", mapQuery:"昇仙峡"},
      night:{name:"甲府盆地 夜景スポット(和田峠)", desc:"盆地いっぱいに広がる街の灯りを見渡せる、地元で人気の高台。", mapQuery:"和田峠 甲府"}
    }
  ];

  var n = DESTINATIONS.length;
  var segAngle = 360 / n;
  var R = 190, cx = 200, cy = 200, labelR = 128;

  function pt(angleDeg, r){
    var a = angleDeg * Math.PI / 180;
    return { x: cx + r * Math.sin(a), y: cy - r * Math.cos(a) };
  }

  function buildWheel(){
    var g = document.getElementById('wheelGroup');
    var html = "";
    for (var i = 0; i < n; i++){
      var a0 = i * segAngle, a1 = (i + 1) * segAngle;
      var p0 = pt(a0, R), p1 = pt(a1, R);
      var fill = DESTINATIONS[i].accent;
      html += '<path d="M' + cx + ',' + cy + ' L' + p0.x.toFixed(2) + ',' + p0.y.toFixed(2) +
              ' A' + R + ',' + R + ' 0 0 1 ' + p1.x.toFixed(2) + ',' + p1.y.toFixed(2) + ' Z" ' +
              'fill="' + fill + '" stroke="#fffaf1" stroke-width="4"></path>';

      var mid = a0 + segAngle / 2;
      var flip = (mid > 90 && mid < 270) ? 180 : 0;
      var labelY = cy - labelR;
      var textColor = (DESTINATIONS[i].text === "dark") ? "#2b2440" : "#fffaf1";
      html += '<g transform="rotate(' + mid + ' ' + cx + ' ' + cy + ')">' +
                '<g transform="rotate(' + flip + ' ' + cx + ' ' + labelY + ')">' +
                  '<text x="' + cx + '" y="' + labelY + '" text-anchor="middle" fill="' + textColor + '">' +
                    '<tspan x="' + cx + '" dy="-16" font-size="28">' + DESTINATIONS[i].emoji + '</tspan>' +
                    '<tspan x="' + cx + '" dy="22" font-size="14" font-family="Zen Maru Gothic, sans-serif" font-weight="700">' + (DESTINATIONS[i].wheelLabel || DESTINATIONS[i].name) + '</tspan>' +
                  '</text>' +
                '</g>' +
              '</g>';
    }
    g.innerHTML = html;
  }

  function buildBulbs(){
    var wrap = document.getElementById('bulbs');
    var count = 16, radius = 50;
    var html = "";
    for (var i = 0; i < count; i++){
      var angle = (360 / count) * i;
      html += '<i style="transform:translate(-50%,-50%) rotate(' + angle + 'deg) translate(0,-' + radius + '%);animation-delay:' + (i * 0.09) + 's"></i>';
    }
    wrap.innerHTML = html;
  }

  function buildStars(){
    var wrap = document.getElementById('stars');
    var html = "";
    for (var i = 0; i < 26; i++){
      var top = Math.random() * 70;
      var left = Math.random() * 100;
      var delay = Math.random() * 3;
      html += '<i style="top:' + top.toFixed(1) + '%;left:' + left.toFixed(1) + '%;animation-delay:' + delay.toFixed(2) + 's"></i>';
    }
    wrap.innerHTML = html;
  }

  function mapsUrl(query){
    return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(query);
  }

  function launchConfetti(){
    var overlay = document.getElementById('jackpot');
    var colors = ["#ffc857", "#ff6b4a", "#2b2440", "#7c6cf0", "#2fb8c6"];
    var pieces = document.querySelectorAll('.confetti-piece');
    pieces.forEach(function(p){ p.remove(); });
    for (var i = 0; i < 40; i++){
      var el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.left = (Math.random() * 100) + '%';
      el.style.background = colors[i % colors.length];
      el.style.animationDuration = (1.4 + Math.random() * 1.1) + 's';
      el.style.animationDelay = (Math.random() * 0.4) + 's';
      el.style.transform = 'rotate(' + (Math.random() * 360) + 'deg)';
      overlay.appendChild(el);
    }
  }

  function fillShiori(dest){
    document.getElementById('hero').style.setProperty('--hero-bg', 'linear-gradient(135deg,' + dest.accent + ', #2b2440 130%)');
    document.getElementById('badgePref').textContent = dest.pref;
    document.getElementById('badgeRoute').textContent = dest.route;
    document.getElementById('heroEmoji').textContent = dest.emoji;
    document.getElementById('heroName').textContent = dest.name;
    document.getElementById('heroDesc').textContent = dest.desc;
    document.getElementById('mainMapLink').href = mapsUrl(dest.mainMapQuery);

    document.getElementById('sightName').textContent = dest.sight.name;
    document.getElementById('sightDesc').textContent = dest.sight.desc;
    document.getElementById('sightMapLink').href = mapsUrl(dest.sight.mapQuery);

    document.getElementById('nightName').textContent = dest.night.name;
    document.getElementById('nightDesc').textContent = dest.night.desc;
    document.getElementById('nightMapLink').href = mapsUrl(dest.night.mapQuery);
  }

  var currentRotation = 0;
  var spinning = false;
  var wheelGroup = document.getElementById('wheelGroup');
  var spinBtn = document.getElementById('spinBtn');
  var jackpot = document.getElementById('jackpot');
  var viewRoulette = document.getElementById('view-roulette');
  var viewShiori = document.getElementById('view-shiori');

  function spin(){
    if (spinning) return;
    spinning = true;
    spinBtn.disabled = true;

    var idx = Math.floor(Math.random() * n);
    var segMid = idx * segAngle + segAngle / 2;
    var desiredMod = (360 - segMid + 360) % 360;
    var spins = 6 + Math.floor(Math.random() * 2);
    var curMod = ((currentRotation % 360) + 360) % 360;
    var delta = spins * 360 + ((desiredMod - curMod + 360) % 360);
    currentRotation += delta;
    wheelGroup.style.transform = 'rotate(' + currentRotation + 'deg)';

    function onDone(){
      wheelGroup.removeEventListener('transitionend', onDone);
      reveal(idx);
    }
    wheelGroup.addEventListener('transitionend', onDone);
  }

  function reveal(idx){
    var dest = DESTINATIONS[idx];
    fillShiori(dest);
    launchConfetti();
    jackpot.style.display = 'flex';
    setTimeout(function(){
      jackpot.style.display = 'none';
      viewRoulette.style.display = 'none';
      viewShiori.style.display = 'block';
      spinning = false;
      spinBtn.disabled = false;
    }, 1300);
  }

  spinBtn.addEventListener('click', spin);
  document.getElementById('againBtn').addEventListener('click', function(){
    viewShiori.style.display = 'none';
    viewRoulette.style.display = 'flex';
    window.scrollTo(0,0);
  });

  buildWheel();
  buildBulbs();
  buildStars();
})();
</script>
</body>
</html>
